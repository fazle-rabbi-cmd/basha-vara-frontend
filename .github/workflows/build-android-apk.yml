name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_APP_VERSION: ${{ vars.APP_VERSION || '1.0.0' }}
          NEXT_PUBLIC_APP_BUILD_NUMBER: ${{ vars.APP_BUILD_NUMBER || '1' }}
          NEXT_PUBLIC_ANDROID_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/basha-vara-latest.apk

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build APK (Debug)
        if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type != 'release')
        working-directory: ./android
        env:
          APP_VERSION_VALUE: ${{ vars.APP_VERSION || '1.0.0' }}
          APP_BUILD_NUMBER_VALUE: ${{ vars.APP_BUILD_NUMBER || '1' }}
        run: |
          APP_VERSION_VALUE="${APP_VERSION_VALUE//$'\r'/}"
          APP_VERSION_VALUE="${APP_VERSION_VALUE//$'\n'/}"
          APP_BUILD_NUMBER_VALUE="${APP_BUILD_NUMBER_VALUE//$'\r'/}"
          APP_BUILD_NUMBER_VALUE="${APP_BUILD_NUMBER_VALUE//$'\n'/}"
          ./gradlew assembleDebug --stacktrace "-PVERSION_NAME=${APP_VERSION_VALUE}" "-PVERSION_CODE=${APP_BUILD_NUMBER_VALUE}"

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        working-directory: ./android/app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Rebuild signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        working-directory: ./android
        env:
          APP_VERSION_VALUE: ${{ vars.APP_VERSION || '1.0.0' }}
          APP_BUILD_NUMBER_VALUE: ${{ vars.APP_BUILD_NUMBER || '1' }}
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APP_VERSION_VALUE="${APP_VERSION_VALUE//$'\r'/}"
          APP_VERSION_VALUE="${APP_VERSION_VALUE//$'\n'/}"
          APP_BUILD_NUMBER_VALUE="${APP_BUILD_NUMBER_VALUE//$'\r'/}"
          APP_BUILD_NUMBER_VALUE="${APP_BUILD_NUMBER_VALUE//$'\n'/}"
          ./gradlew assembleRelease --stacktrace "-PVERSION_NAME=${APP_VERSION_VALUE}" "-PVERSION_CODE=${APP_BUILD_NUMBER_VALUE}"

      - name: Create stable latest APK asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/basha-vara-latest.apk

      - name: Upload APK (Debug)
        if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type != 'release')
        uses: actions/upload-artifact@v4
        with:
          name: basha-vara-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload APK (Release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: basha-vara-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/basha-vara-latest.apk
