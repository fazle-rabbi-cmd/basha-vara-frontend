<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fdfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with gradient -->
  <rect x="0" y="0" width="2732" height="2732" fill="url(#splashGradient)" />

  <!-- Animated decorative circles (static representation) -->
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="400" cy="400" r="250" />
    <circle cx="2332" cy="400" r="350" />
    <circle cx="400" cy="2332" r="300" />
    <circle cx="2332" cy="2332" r="220" />
    <circle cx="1366" cy="450" r="180" />
    <circle cx="1366" cy="2282" r="250" />
  </g>

  <!-- Decorative rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4">
    <circle cx="1366" cy="1366" r="550" />
    <circle cx="1366" cy="1366" r="680" />
    <circle cx="1366" cy="1366" r="800" />
  </g>

  <!-- App Icon centered with glow effect -->
  <g transform="translate(1366, 1366)" filter="url(#iconShadow)">
    <!-- Icon background circle with gradient -->
    <circle cx="0" cy="0" r="380" fill="url(#iconGradient)" />

    <!-- Icon glow ring -->
    <circle cx="0" cy="0" r="395" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" filter="url(#glow)" />

    <!-- House icon (scaled for splash) -->
    <g transform="translate(-240, -240) scale(0.47)">
      <!-- Main house body -->
      <path d="M512 220 L260 440 L260 750 L380 750 L380 550 L644 550 L644 750 L764 750 L764 440 Z" fill="#14b8a6" />

      <!-- Roof -->
      <path d="M512 180 L180 470 L240 470 L512 230 L784 470 L844 470 Z" fill="#0d9488" />

      <!-- Door -->
      <rect x="464" y="590" width="96" height="160" rx="8" fill="#ffffff" />

      <!-- Door handle -->
      <circle cx="536" cy="660" r="8" fill="#14b8a6" />

      <!-- Windows -->
      <rect x="300" y="490" width="64" height="64" rx="8" fill="#0f766e" />
      <rect x="660" y="490" width="64" height="64" rx="8" fill="#0f766e" />

      <!-- Window crosses -->
      <line x1="332" y1="490" x2="332" y2="554" stroke="#ffffff" stroke-width="4" />
      <line x1="300" y1="522" x2="364" y2="522" stroke="#ffffff" stroke-width="4" />
      <line x1="692" y1="490" x2="692" y2="554" stroke="#ffffff" stroke-width="4" />
      <line x1="660" y1="522" x2="724" y2="522" stroke="#ffffff" stroke-width="4" />
    </g>
  </g>

  <!-- App name with shadow -->
  <g filter="url(#iconShadow)">
    <text x="1366" y="1900" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">Basha Vara</text>
  </g>

  <!-- Tagline -->
  <text x="1366" y="2050" font-family="Arial, sans-serif" font-size="70" font-weight="normal" fill="#ccfbf1" text-anchor="middle" letter-spacing="2">Find Your Perfect Home</text>

  <!-- Bottom decorative element -->
  <g transform="translate(1366, 2450)">
    <rect x="-100" y="-2" width="200" height="4" rx="2" fill="#ffffff" fill-opacity="0.5" />
  </g>
</svg>
